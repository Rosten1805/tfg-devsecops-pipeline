name: Security Pipeline (reusable)

on:
  workflow_call:
    secrets:
      TMDB_API_KEY:
        required: false
      TMDB_API_URL:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      NEXTAUTH_SECRET:
        required: false
      GOOGLE_ID:
        required: false
      GOOGLE_SECRET:
        required: false
      DATABASE_URL:
        required: false

permissions:
  contents: read

# Every third-party action below is pinned to a full commit SHA, not a
# mutable version tag — a tag can be moved to point at a different commit
# (accidentally or via a compromised maintainer account), a SHA can't. This
# is the supply-chain-integrity practice NIST SP 800-204D recommends for
# CI/CD pipelines. Dependabot is configured (see .github/dependabot.yml) to
# propose PRs bumping these hashes when new releases come out, so this
# doesn't mean losing updates — just reviewing them instead of trusting them
# silently.

jobs:
  sast:
    name: SAST (Semgrep + Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # SonarQube Cloud needs full history, not a shallow clone

      - name: Checkout custom Semgrep rules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Rosten1805/tfg-devsecops-pipeline
          path: .pipeline-rules
          sparse-checkout: |
            .semgrep
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep + Checkov
        run: pip install semgrep checkov

      - name: Run Semgrep
        run: |
          semgrep scan \
            --error \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --config=p/secrets \
            --config=p/sql-injection \
            --config=.pipeline-rules/.semgrep/custom-rules.yml \
            --exclude=node_modules \
            --exclude=.pipeline-rules

      # `if: ${{ !cancelled() }}` on everything from here on: a Semgrep finding above
      # already fails this job (that's the gate), but it shouldn't hide what
      # Checkov/SonarQube found in the same run — all three SAST tools should
      # always get a chance to report, not stop at whichever fails first.
      - name: Run Checkov on Dockerfile
        if: ${{ !cancelled() }}
        run: checkov -f Dockerfile --compact

      - name: Cache SonarQube packages
        if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud Scan
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  build-and-scan:
    name: Build + Trivy
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Set image tag
        id: meta
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/disney-plus-clone:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_URL: ${{ secrets.TMDB_API_URL }}
        run: |
          docker build \
            --secret id=tmdb_api_key,env=TMDB_API_KEY \
            --secret id=tmdb_api_url,env=TMDB_API_URL \
            -t "${{ steps.meta.outputs.image }}" .

      - name: Trivy scan (full report, visibility only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Trivy scan (gate - fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push "${{ steps.meta.outputs.image }}"

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' # only against the image that was actually pushed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: |
            .zap
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Run app container
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/disney-plus-clone:${{ github.sha }}
        run: |
          docker run -d --name app -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e NEXTAUTH_SECRET='${{ secrets.NEXTAUTH_SECRET }}' \
            -e GOOGLE_ID='${{ secrets.GOOGLE_ID }}' \
            -e GOOGLE_SECRET='${{ secrets.GOOGLE_SECRET }}' \
            -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            -e TMDB_API_URL='${{ secrets.TMDB_API_URL }}' \
            "$IMAGE"

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App never became healthy"
          docker logs app
          exit 1

      # Passive baseline scan only (no active attack payloads) against the
      # app's public, unauthenticated pages — see TFT write-up for why
      # authenticated scanning is deferred rather than attempted here.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
